name: Mise à jour quotidienne des données

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les capitalisations par narratif (CoinGecko)
        run: python scripts/fetch_narratives.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      - name: Générer les alertes (mouvements + narratifs émergents)
        run: python scripts/generate_alerts.py

      - name: Récupérer le Fear & Greed Index
        run: python scripts/fetch_feargreed.py
        continue-on-error: true

      - name: Récupérer les tendances de recherche (Google Trends)
        run: python scripts/fetch_trends.py
        continue-on-error: true

      - name: Commit et push si changement
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/*.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push
