name: Mise à jour quotidienne des données

on:
  schedule:
    # 06:00 UTC chaque jour — ajustez si besoin
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les capitalisations par narratif (CoinGecko)
        run: python scripts/fetch_narratives.py

      - name: Récupérer les tendances de recherche (Google Trends)
        run: python scripts/fetch_trends.py
        continue-on-error: true   # pytrends est non-officiel, ne bloque pas le reste si ça casse

      - name: Commit et push si changement
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/*.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique des données ($(date -u +%Y-%m-%d))"
          git push
